# Moved to top level for now.
nside              : ${nside}
detector_freqs     : ${detectors}
map_fields         : ${map_fields}
 
precision          : float  # Is this used? No.
units              : uK_CMB  # Used in many places (search for cfg.scenario.units)

# If use_rimo, the transmission amounts per wavenumber from the RIMO are loaded
#   this activates the use of bandpass integration! (Stop forgetting this, me!)
# bandpass_integration = use_rimo! use_rimo = bandpass_integration!
use_rimo           : true
use_rimo_cen_freq  : true
rimo_trim_to_mass  : 0.999
rimo_compress_to_n : 50
rimo_compress_alpha: 0.5

