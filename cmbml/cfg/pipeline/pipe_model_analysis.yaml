common_post_map_real:
  assets_out:
    cmb_map:
      handler: HealpyMap
      path_template: "{root}/{dataset}/Sims_Analysis/{stage}/{split}/{sim}/cmb_real_post_beam_{beam_name}.fits"
  assets_in:
    cmb_map: {stage: make_sims}
    mask: {stage: make_mask}
  make_stage_log: True
  splits: ${splits.run_inference_on}
  dir_name: Analysis_D_Post_Map_Real

common_post_map_pred:
  assets_out:
    cmb_map:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_pred_post_{epoch}_beam_{beam_name}.fits"
  assets_in:
    cmb_map: {stage: final_infer}
    mask: {stage: make_mask}
  make_stage_log: True
  splits: ${splits.run_inference_on}
  dir_name: Analysis_E_Post_Map_Pred
  epochs: ${use_epochs_imgs}

show_cmb_post_masked:
  assets_out:
    cmb_map_render:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_{epoch}_{field}_{beam_name}.{fig_type}"
  assets_in:
    cmb_map_post: {stage: common_post_map_pred, orig_name: cmb_map}
    cmb_map_sim: {stage: common_post_map_real, orig_name: cmb_map}
    mask: {stage: make_mask}
  splits: ${splits.run_inference_on}
  override_n_sims: ${n_show_cap}    
  plot_min_max: 500                  # value, v: plots from -v to +v; null: allow MPL to choose; list (size 2): min and max val
  make_stage_log: False
  dir_name: Analysis_2_Show_CMB_Post
  epochs: ${use_epochs_imgs}

pixel_analysis:
  assets_out:
    report:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/pixel_report.yaml"
  assets_in:
    cmb_map_post: {stage: common_post_map_pred, orig_name: cmb_map}
    cmb_map_sim: {stage: common_post_map_real, orig_name: cmb_map}
    mask: {stage: make_mask}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_map_stats}
  dir_name: Analysis_F_Pixel_Report

pixel_summary_tables:
  assets_out:
    overall_stats:
      path_template: "{root}/{dataset}/{working}{stage}/epoch_{epoch}/overall_stats.csv"
      handler: PandasCsvHandler
    stats_per_split:
      path_template: "{root}/{dataset}/{working}{stage}/epoch_{epoch}/stats_per_split.csv"
      handler: PandasCsvHandler
  assets_in:
    report: {stage: pixel_analysis}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_map_stats}
  dir_name: Analysis_3_Pixel_Summary_Tables

pixel_summary_figs:
  assets_out:
    boxplots:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/epoch_{epoch}/boxplots.{fig_type}"
    histogram:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/epoch_{epoch}/{metric}_histogram.{fig_type}"
  assets_in:
    report: {stage: pixel_analysis}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_map_stats}
  dir_name: Analysis_4_Pixel_Summary_Figs

make_real_ps:
  assets_out:
    # Autocorrelation for realization (target)
    auto_real:
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/ps_real.npy"
      handler: NumpyPowerSpectrum
  assets_in:
    cmb_map_real: {stage: make_sims, orig_name: cmb_map}
    mask:    {stage: make_mask}
    mask_sm: {stage: make_mask}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_K_Power_Spectra

make_pred_ps:
  assets_out:
    # Autocorrelation for prediction
    auto_pred:
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/ps_pred_{epoch}.npy"
      handler: NumpyPowerSpectrum
  assets_in:
    cmb_map_post: {stage: final_infer, orig_name: cmb_map}
    mask:    {stage: make_mask}
    mask_sm: {stage: make_mask}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_K_Power_Spectra

one_ps_fig:  # Produce a power spectrum without needing the rest of the spectra from the training set
  assets_out:
    ps_figure:
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_figure_{epoch}.pdf"
      handler: EmptyHandler
  assets_in:
    theory_ps: {stage: convert_theory_ps}
    auto_real: {stage: make_pred_ps}
    auto_pred: {stage: make_pred_ps}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  override_n_sims: ${n_show_cap}
  dir_name: Analysis_11_One_PS_Fig

loss_plot:
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/loss_plot.{fig_type}"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_N_Loss_Plot
  make_stage_log: False
