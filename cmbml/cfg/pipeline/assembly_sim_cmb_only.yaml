defaults:
  - _self_
  - pipe_raw
  - pipe_sim
  - pipe_noise_model
  - pipe_sim_analysis
  - adapt_sim_flex


make_theory_ps:
  assets_out:
    cmb_ps:
      # TODO: There's a better way to do this. This is a recipe for cruft
      #       But it will suffice for make_cmb_only, the next stage.
      handler: DictCambPowerSpectrum
make_cmb_only:
  assets_out:
    cmb_map:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{stage}/{split}/{sim}/cmb_map_fid.fits"
  assets_in:
    cmb_ps: {stage: make_theory_ps}
  splits: [train, valid, test]
  dir_name: Simulation
  make_stage_log: True
  top_level_working: True
