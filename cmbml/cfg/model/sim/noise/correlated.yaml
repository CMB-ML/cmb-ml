noise_type: correlated

src_files:
  30 : ${scenario.ref_data_release[30].file}
  44 : ${scenario.ref_data_release[44].file}
  70 : ${scenario.ref_data_release[70].file}
  100: ${scenario.ref_data_release[100].file}
  143: ${scenario.ref_data_release[143].file}
  217: ${scenario.ref_data_release[217].file}
  353: ${scenario.ref_data_release[353].file}
  545: ${scenario.ref_data_release[545].file}
  857: ${scenario.ref_data_release[857].file}

src_nside_lookup:
  30 : ${scenario.ref_data_release[30].nside}
  44 : ${scenario.ref_data_release[44].nside}
  70 : ${scenario.ref_data_release[70].nside}
  100: ${scenario.ref_data_release[100].nside}
  143: ${scenario.ref_data_release[143].nside}
  217: ${scenario.ref_data_release[217].nside}
  353: ${scenario.ref_data_release[353].nside}
  545: ${scenario.ref_data_release[545].nside}
  857: ${scenario.ref_data_release[857].nside}

seed_template      : "{split}_{sim}_{freq}_noise"
save_noise: true  # Save noise if generating it in a separate executor as is done for the current implementation
lmax_ratio_out_noise : 2.9999
do_beam_filter: true

hdu_n: ${scenario.ref_data_release.hdu_n}      # Consistent for these map files

# Number of Planck Noise simulations to use (max 300, bear in mind the download time!)
n_planck_noise_sims     : 100
# This is not a bandwidth limited scenario!
# TODO: CHANGE THIS BACK TO 2 (after review period)! Needed to be higher for use with lower source average maps
lmax_ratio_planck_noise : 2
# Number of degrees total to mask around the galactic plane
#    10, the default, will mask 5 degrees above and below the plane
mask_galactic_size      : 10
# Smoothing (degrees) of the simple galactic plane mask
mask_galactic_smooth    : 1
